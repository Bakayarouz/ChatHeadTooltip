# Reload messages (Supports MiniMessage tags)
messages:
  reload: "<green>ChatHeadTooltip configuration reloaded successfully!"
  no-permission: "<red>You do not have permission to use this command."

styles:
  admin:
    permission: "chatheadtooltip.style.admin"
    weight: 100
    tooltip-style: "my_pack:admin_style"
    title: "<player_head> <red><bold>[ADMIN] <player_name></bold></red>"
    lore:
      - "<gray>Rank: <red>Administrator"
      - "<gray>Balance: <green>$%vault_eco_balance_formatted%"
      - "<gray>Health: <red><health>/<max_health> HP"
      - "<gray>Ping: <green><ping>ms"
      - "<gray>World: <white><world>"

  vip:
    permission: "chatheadtooltip.style.vip"
    weight: 50
    tooltip-style: "my_pack:vip_style"
    title: "<player_head> <gold><bold>[VIP] <player_name></bold></gold>"
    lore:
      - "<gray>Rank: <gold>VIP"
      - "<gray>Balance: <green>$%vault_eco_balance_formatted%"
      - "<gray>Health: <red><health>/<max_health> HP"

  default:
    permission: ""
    weight: 0
    tooltip-style: "minecraft:default"
    title: "<player_head> <yellow><player_name></yellow>"
    lore:
      - "<gray>Balance: <green>$%vault_eco_balance_formatted%"
      - "<gray>Health: <red><health>/<max_health> HP"
      - "<gray>Ping: <green><ping>ms"
